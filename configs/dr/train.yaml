# Training DR ranges (mvp.md §4.2). Friction/mass/gain are multipliers on nominal values;
# obs_noise is the std (m) of Gaussian noise on `observation`; latency is a delay in env steps.
obj_friction: {type: uniform, low: 0.5, high: 1.5}
table_friction: {type: uniform, low: 0.7, high: 1.3}
obj_mass: {type: uniform, low: 0.5, high: 2.0}
gain: {type: uniform, low: 0.8, high: 1.2}
obs_noise: {type: uniform, low: 0.0, high: 0.005}
latency: {type: choice, values: [0, 1]}
